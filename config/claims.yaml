# Cottonwood outreach claims library (R-19).
#
# Each claim a draft may make, with its status:
#   verified    the founder approved it in writing; a draft may use it
#   unverified  not yet confirmed; a draft that uses it is flagged and cannot be sent
#   prohibited  never to be used in outreach
#
# A claim becomes verified only through a founder claim approval:
#   1. cottonwood approve claim ID --approver NAME --reference "email DATE Re: SUBJECT"
#   2. set status: verified, verified_by and verified_at here exactly as that command prints.
# `cottonwood claims` shows each claim's effective status and exits 1 on any mismatch: a claim
# marked verified here without a matching approval, or approved but still unverified here.
# The CLI never rewrites this file. Ids are lower-kebab-case and must not change once used.

claims:
  - id: fashion-place-attribution
    text: "Cottonwood Contractors was the general contractor on the Fashion Place entrance concourse."
    status: unverified
    evidence: "Open founder question: whether Cottonwood was in fact the GC on the Fashion Place entrance concourse, and whether its images may be reused (docs/cottonwood-growth-engine.md, open questions)."
    verified_by: null
    verified_at: null
  - id: service-area
    text: "Cottonwood Contractors serves Salt Lake, Utah, Davis and Weber counties."
    status: unverified
    evidence: "Open founder question: the website advertises Salt Lake County while prospecting targets four counties (docs/cottonwood-growth-engine.md, open questions)."
    verified_by: null
    verified_at: null
  - id: license-classification
    text: "Cottonwood Contractors holds a Utah contractor license in the classification stated in the draft."
    status: unverified
    evidence: "Open founder question: legal entity and Utah contractor license classification (docs/cottonwood-growth-engine.md, open questions)."
    verified_by: null
    verified_at: null
  - id: insurance-bonding
    text: "Cottonwood Contractors is insured and bonded for the project types stated in the draft."
    status: unverified
    evidence: "Open founder question: insurance, bonding and permitted project types (docs/cottonwood-growth-engine.md, open questions)."
    verified_by: null
    verified_at: null
  - id: prior-company-experience
    text: "The founder's project experience at a prior company, as described in the draft."
    status: unverified
    evidence: "Not yet sourced: the founder must confirm which prior-company projects may be cited and how (R-19)."
    verified_by: null
    verified_at: null
