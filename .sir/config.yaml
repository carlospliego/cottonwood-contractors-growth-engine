# sir configuration. Edit freely; /sir:init re-runs only fill missing keys.
# Schema: schemas/config.schema.json in the sir plugin.
version: 1
project:
  name: cottonwood-contractors-growth-engine
  prefix: CCGE
  id_digits: 3
  default_branch: main
paths:
  work: work
checks:
  test: uv run pytest
  lint: uv run ruff check .
  typecheck: uv run mypy .
  build: null
  format: uv run ruff format --check .
versioning:
  scheme: none
  files: []
  changelog: null
verify:
  repair_cap: 3
models:
  implement: inherit
  check: sonnet
