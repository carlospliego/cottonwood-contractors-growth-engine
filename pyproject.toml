[project]
name = "cottonwood"
version = "0.1.0"
description = "Cottonwood Contractors growth engine: a local CLI over one SQLite file."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "tzdata>=2026.6",
]

[project.scripts]
cottonwood = "cottonwood.cli:entry"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cottonwood"]

[tool.uv]
cache-dir = ".uv-cache"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["cottonwood", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
